name: ReFlash Vulkan Alpha CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test Vulkan-safe ReFlash against offline API fakes
        run: bash vulkan-tests/test.sh
      - name: Install Java 25 for Fabric Loom
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build remapped Fabric JAR
        run: gradle --no-daemon clean build --stacktrace
      - name: Verify JAR metadata
        run: python3 tools/verify_jar.py build/libs/reflash-0.9.2-vulkan-alpha.jar
      - name: SHA-256 checksum
        run: sha256sum build/libs/reflash-0.9.2-vulkan-alpha.jar > build/libs/reflash-0.9.2-vulkan-alpha.jar.sha256
      - name: Upload alpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: ReFlash-0.9.2-Vulkan-alpha-UNTESTED
          path: |
            build/libs/reflash-0.9.2-vulkan-alpha.jar
            build/libs/reflash-0.9.2-vulkan-alpha.jar.sha256
          if-no-files-found: error
